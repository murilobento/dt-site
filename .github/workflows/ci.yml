name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTENT_SOURCE: fixtures
      LEAD_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    env:
      CONTENT_SOURCE: fixtures
      LEAD_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Lighthouse CI (bloqueia o merge)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx lhci autorun
